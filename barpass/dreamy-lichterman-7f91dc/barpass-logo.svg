<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>

    <!-- Background: near-black with faint violet nightlife undertone -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0f0e18"/>
      <stop offset="100%" stop-color="#060509"/>
    </linearGradient>

    <!-- Subtle center radial glow (depth, not visible as a shape) -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="46%">
      <stop offset="0%"   stop-color="#1c1a30" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060509"  stop-opacity="0"/>
    </radialGradient>

    <!--
      Platinum silver gradient — flows top-left bright to bottom-right shadow.
      Mimics light hitting a polished metal surface.
      gradientUnits=userSpaceOnUse so it reads consistently across the whole B.
    -->
    <linearGradient id="platinum"
      x1="382" y1="252" x2="642" y2="772"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="28%"  stop-color="#e4e4f2"/>
      <stop offset="58%"  stop-color="#b4b4cc"/>
      <stop offset="100%" stop-color="#7a7a96"/>
    </linearGradient>

    <!--
      Sheen overlay — bright horizontal band across the top of the B
      to simulate the reflection of a light source above.
    -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="40%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Crisp, subtle silver glow behind the mark -->
    <filter id="glow" x="-25%" y="-20%" width="150%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0.7 0.7 1   0 0
                0.7 0.7 1   0 0
                0.9 0.9 1   0 0
                0   0   0   0.28 0" result="silvGlow"/>
      <feMerge>
        <feMergeNode in="silvGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="1024" height="1024" rx="222" ry="222"/>
    </clipPath>

  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="1024" height="1024" rx="222" ry="222" fill="url(#bg)"/>
  <!-- depth glow -->
  <ellipse cx="512" cy="512" rx="360" ry="340" fill="url(#bgGlow)" clip-path="url(#clip)"/>

  <!-- ── B MARK ──
    Geometry (perfectly centered in 1024×1024):
      Spine:        x=382–462, y=252–772   (80 px wide, 520 px tall)
      Upper bump:   outer arc rx=160 ry=125, inner arc rx=90 ry=55
                    both centered at (462, 377); frame = 70 px
      Lower bump:   outer arc rx=180 ry=135, inner arc rx=110 ry=65
                    both centered at (462, 637); frame = 70 px
      Total B:      x=382–642 (260 px), y=252–772 (520 px)
      B center:     x=512 ✓, y=512 ✓
  -->
  <g filter="url(#glow)" clip-path="url(#clip)">

    <!-- Left spine -->
    <rect x="382" y="252" width="80" height="520" fill="url(#platinum)"/>

    <!--
      Upper bump — evenodd: outer D minus inner D = annular arc of 70 px stroke.
      M start at top of flat edge → arc CW to bottom → line back → Z.
      Inner subpath is same direction; evenodd flips fill inside overlap.
    -->
    <path fill-rule="evenodd" fill="url(#platinum)" d="
      M 462 252 A 160 125 0 0 1 462 502 L 462 252 Z
      M 462 322 A  90  55 0 0 1 462 432 L 462 322 Z
    "/>

    <!-- Lower bump — slightly wider (rx 180 vs 160) for classic B proportion -->
    <path fill-rule="evenodd" fill="url(#platinum)" d="
      M 462 502 A 180 135 0 0 1 462 772 L 462 502 Z
      M 462 572 A 110  65 0 0 1 462 702 L 462 572 Z
    "/>

    <!-- Metallic sheen overlay on top quarter of B -->
    <rect x="382" y="252" width="260" height="220" fill="url(#sheen)" clip-path="url(#clip)"/>

  </g>

</svg>
