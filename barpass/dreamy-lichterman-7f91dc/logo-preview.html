<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 40px;
      flex-wrap: wrap;
      padding: 40px;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #666;
      font-family: -apple-system, sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
    }
    img { display: block; border-radius: 22%; }
    .size-256 img { width: 256px; height: 256px; }
    .size-120 img { width: 120px; height: 120px; }
    .size-60  img { width: 60px;  height: 60px; border-radius: 14px; }
  </style>
</head>
<body>
  <div class="card size-256">
    <img src="barpass-logo.svg" alt="BarPass logo 256"/>
    <span>256 × 256</span>
  </div>
  <div class="card size-120">
    <img src="barpass-logo.svg" alt="BarPass logo 120"/>
    <span>120 × 120</span>
  </div>
  <div class="card size-60">
    <img src="barpass-logo.svg" alt="BarPass logo 60"/>
    <span>60 × 60</span>
  </div>
</body>
</html>
