<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BarPass — Stadium Operations Map</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="barpass-db.js"></script>
<style>
:root{
  --bg:#f2f3f5;--card:#ffffff;--border:#dde1ea;--surface:#f8f9fb;
  --text:#0f1225;--muted:#6b7394;--dark:#080c1a;
  --green:#00c85a;--amber:#f5a623;--red:#e8284a;--blue:#0062ff;--purple:#7c3aed;
  --pink:#e91e8c;--section-default:#d1d5e0;--section-active:#f0d0e0;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);}

/* ── Layout ── */
.app{display:grid;grid-template-columns:340px 1fr;grid-template-rows:52px 1fr;height:100vh;}
.topbar{grid-column:1/-1;grid-row:1;background:var(--dark);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:200;border-bottom:1px solid #1a2040;}
.sidebar{grid-column:1;grid-row:2;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:100;}
#map{grid-column:2;grid-row:2;}

/* ── Topbar ── */
.tb-brand{display:flex;align-items:center;gap:8px;color:#fff;}
.tb-mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#5AA5FF,#a855f7);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:11px;color:#fff;}
.tb-name{font-weight:700;font-size:14px;letter-spacing:-.01em;}
.tb-sub{font-family:var(--mono);font-size:8px;color:#4a5380;letter-spacing:.1em;}
.tb-sep{width:1px;height:28px;background:#1a2040;}
.tb-scene{display:flex;gap:2px;}
.ts-btn{padding:5px 10px;border-radius:5px;border:none;background:transparent;color:#4a5380;font-family:var(--mono);font-size:9px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.04em;}
.ts-btn.on{background:#5AA5FF18;color:#5AA5FF;border:1px solid #5AA5FF30;}
.ts-btn:hover{color:#e8eaf6;}
.tb-stats{display:flex;gap:6px;margin-left:auto;}
.ts{background:#0c1022;border:1px solid #1a2040;border-radius:6px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;min-width:52px;}
.ts-val{font-family:var(--mono);font-size:13px;font-weight:700;color:#e8eaf6;}
.ts-lbl{font-family:var(--mono);font-size:7px;color:#4a5380;letter-spacing:.06em;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:p 2s infinite;}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.live-badge{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:16px;background:#00c85a10;border:1px solid #00c85a30;font-family:var(--mono);font-size:9px;color:var(--green);}

/* ── Sidebar ── */
.sb-search{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center;}
.sb-inp{flex:1;padding:7px 10px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--mono);font-size:10px;outline:none;transition:border-color .15s;}
.sb-inp:focus{border-color:var(--blue);}
.sb-cats{display:flex;gap:0;border-bottom:1px solid var(--border);}
.cat-btn{flex:1;padding:8px 4px;border:none;background:transparent;color:var(--muted);font-family:var(--mono);font-size:8px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;gap:3px;}
.cat-btn.on{color:var(--red);border-bottom-color:var(--red);}
.cat-btn:hover{color:var(--text);}
.cat-icon{font-size:14px;}
.sb-list{flex:1;overflow-y:auto;}
.sb-list::-webkit-scrollbar{width:4px;}
.sb-list::-webkit-scrollbar-thumb{background:var(--border);}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f2f7;cursor:pointer;transition:background .1s;}
.sb-item:hover,.sb-item.sel{background:#f0f5ff;}
.sb-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.sb-info{flex:1;min-width:0;}
.sb-name{font-size:12px;font-weight:600;margin-bottom:2px;}
.sb-meta{font-family:var(--mono);font-size:9px;color:var(--muted);}
.sb-arr{color:var(--border);font-size:16px;flex-shrink:0;}

/* ── Detail Card ── */
.detail-card{position:absolute;left:340px;bottom:0;width:340px;background:var(--card);border:1px solid var(--border);border-radius:0 14px 0 0;z-index:200;box-shadow:0 -4px 24px rgba(0,0,0,.12);transform:translateY(100%);transition:transform .25s ease;}
.detail-card.open{transform:translateY(0);}
.dc-hero{height:160px;display:flex;align-items:center;justify-content:center;border-radius:0 14px 0 0;position:relative;}
.dc-close{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.25);border:none;color:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.dc-hero-icon{font-size:52px;opacity:.9;}
.dc-body{padding:14px 16px;}
.dc-name{font-size:16px;font-weight:700;margin-bottom:2px;}
.dc-loc{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:12px;}
.dc-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f2f7;font-size:11px;}
.dc-lbl{color:var(--muted);}
.dc-val{font-weight:600;}
.dc-actions{padding:12px 16px;display:flex;gap:8px;border-top:1px solid var(--border);}
.dc-btn{flex:1;padding:10px;border-radius:9px;font-weight:700;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;border:none;}
.dc-btn.primary{background:var(--dark);color:#fff;}
.dc-btn.primary:hover{background:#0c1528;}
.dc-btn.secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.dc-btn.secondary:hover{border-color:var(--text);}

/* ── Map controls ── */
.map-controls{position:absolute;top:10px;right:10px;z-index:100;display:flex;flex-direction:column;gap:6px;}
.mc-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:all .15s;}
.mc-btn:hover{background:var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.15);}
.floor-sel{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.fs{padding:7px 10px;border:none;background:transparent;color:var(--muted);font-family:var(--mono);font-size:9px;font-weight:700;cursor:pointer;text-align:center;border-bottom:1px solid var(--border);transition:all .15s;}
.fs:last-child{border-bottom:none;}
.fs.on{background:var(--blue);color:#fff;}
.fs:hover:not(.on){background:var(--surface);}

/* POI Marker on map */
.poi-marker{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;border:3px solid rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(0,0,0,.3);transition:transform .15s;}
.poi-marker:hover{transform:scale(1.15);}
.poi-label{font-family:var(--mono);font-size:9px;font-weight:700;background:rgba(255,255,255,.95);border-radius:4px;padding:1px 5px;white-space:nowrap;margin-top:-4px;box-shadow:0 1px 4px rgba(0,0,0,.2);}

/* Map attribution */
.maplibregl-ctrl-attrib{font-size:8px!important;}
.maplibregl-ctrl-bottom-right{display:none;}
.maplibregl-ctrl-bottom-left .maplibregl-ctrl-scale{border-color:rgba(0,0,0,.3);color:rgba(0,0,0,.6);}
</style>
</head>
<body>
<div class="app">

<!-- Topbar -->
<div class="topbar">
  <div class="tb-brand">
    <div class="tb-mark">BP</div>
    <div><div class="tb-name">BarPass Operations</div><div class="tb-sub">HARD ROCK STADIUM · MIAMI</div></div>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-scene">
    <button class="ts-btn on" onclick="setScene('ops',this)">⚙ OPS</button>
    <button class="ts-btn" onclick="setScene('food',this)">🍺 FOOD</button>
    <button class="ts-btn" onclick="setScene('security',this)">🛡 SECURITY</button>
    <button class="ts-btn" onclick="setScene('vip',this)">👑 VIP</button>
    <button class="ts-btn" onclick="setScene('crowd',this)">🌡 CROWD</button>
  </div>
  <div class="tb-stats">
    <div class="ts"><div class="ts-val" id="hs-staff" style="color:#5AA5FF">0</div><div class="ts-lbl">STAFF</div></div>
    <div class="ts"><div class="ts-val" id="hs-alerts" style="color:#e8284a">0</div><div class="ts-lbl">ALERTS</div></div>
    <div class="ts"><div class="ts-val" id="hs-crowd" style="color:#f5a623">0%</div><div class="ts-lbl">CROWD</div></div>
    <div class="ts"><div class="ts-val" id="hs-rev" style="color:#00c85a">$0</div><div class="ts-lbl">REVENUE</div></div>
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
  </div>
  <a href="hub.html" style="margin-left:8px;padding:5px 12px;border-radius:7px;border:1px solid #1a2040;background:transparent;color:#4a5380;font-family:var(--mono);font-size:9px;text-decoration:none;transition:all .15s;" onmouseover="this.style.color='#e8eaf6'" onmouseout="this.style.color='#4a5380'">← Hub</a>
</div>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sb-search">
    <input class="sb-inp" id="sb-search" placeholder="Search zones, concessions…" oninput="filterList()">
  </div>
  <div class="sb-cats" id="sb-cats">
    <button class="cat-btn on" data-cat="all" onclick="setCat('all',this)"><span class="cat-icon">🏟</span>ALL</button>
    <button class="cat-btn" data-cat="food" onclick="setCat('food',this)"><span class="cat-icon">🍔</span>FOOD</button>
    <button class="cat-btn" data-cat="drink" onclick="setCat('drink',this)"><span class="cat-icon">🍺</span>DRINKS</button>
    <button class="cat-btn" data-cat="staff" onclick="setCat('staff',this)"><span class="cat-icon">👤</span>STAFF</button>
    <button class="cat-btn" data-cat="info" onclick="setCat('info',this)"><span class="cat-icon">ℹ</span>INFO</button>
  </div>
  <div class="sb-list" id="sb-list"></div>
</div>

<!-- Map -->
<div id="map" style="position:relative;">
  <!-- Detail Card -->
  <div class="detail-card" id="detail-card">
    <div class="dc-hero" id="dc-hero">
      <button class="dc-close" onclick="closeDetail()">✕</button>
      <div class="dc-hero-icon" id="dc-icon">🍔</div>
    </div>
    <div class="dc-body">
      <div class="dc-name" id="dc-name">Concession</div>
      <div class="dc-loc" id="dc-loc">Level 000, Miami Stadium, Miami</div>
      <div id="dc-rows"></div>
    </div>
    <div class="dc-actions">
      <button class="dc-btn secondary" onclick="sendToPhone()">📱 SEND TO PHONE</button>
      <button class="dc-btn primary" onclick="takeMeThere()">◈ TAKE ME THERE</button>
    </div>
  </div>

  <!-- Map controls -->
  <div class="map-controls">
    <button class="mc-btn" onclick="map.zoomIn()" title="Zoom in">+</button>
    <button class="mc-btn" onclick="map.zoomOut()" title="Zoom out">−</button>
    <button class="mc-btn" onclick="map.resetNorth()" title="Reset bearing">⊙</button>
    <button class="mc-btn" onclick="flyToStadium()" title="Fit stadium">⤢</button>
    <div style="height:6px;"></div>
    <div class="floor-sel">
      <button class="fs" onclick="setFloor(3,this)">U3</button>
      <button class="fs" onclick="setFloor(2,this)">C2</button>
      <button class="fs" onclick="setFloor(1,this)">C1</button>
      <button class="fs on" onclick="setFloor(0,this)">FL</button>
    </div>
  </div>
</div>
</div>

<script>
'use strict';

// ── Stadium GIS Engine ──────────────────────────────────────────────────────
const CX = -80.239018, CY = 25.957746; // Hard Rock Stadium center
const DEG_LNG = 1 / (111320 * Math.cos(CY * Math.PI / 180)); // meters to lng degrees
const DEG_LAT = 1 / 111320; // meters to lat degrees

function mLng(m) { return m * DEG_LNG; }
function mLat(m) { return m * DEG_LAT; }

// Generate oval arc points
function arcPoints(rMetersX, rMetersY, startDeg, endDeg, step = 3) {
  const pts = [];
  for (let a = startDeg; a <= endDeg; a += step) {
    const rad = a * Math.PI / 180;
    pts.push([CX + mLng(rMetersX) * Math.cos(rad), CY + mLat(rMetersY) * Math.sin(rad)]);
  }
  return pts;
}

// Generate a stadium ring section (pie slice of oval annulus)
function makeSection(innerX, innerY, outerX, outerY, startDeg, endDeg, props) {
  const outer = arcPoints(outerX, outerY, startDeg, endDeg, 2);
  const inner = arcPoints(innerX, innerY, endDeg, startDeg, 2);
  const coords = [...outer, ...inner, outer[0]];
  return { type: 'Feature', id: props.id, geometry: { type: 'Polygon', coordinates: [coords] }, properties: props };
}

// ── Generate stadium sections ──────────────────────────────────────────────
// Hard Rock Stadium approximate radii (meters):
// Field: 0–48m
// Field level concourse: 48–62m  
// 100-level seats: 62–98m
// 200-level concourse: 98–110m
// 200-level seats: 110–140m
// 300-level concourse: 140–148m
// 300-level seats: 148–175m
// Outer structure: 175–215m

const SECTIONS = { type: 'FeatureCollection', features: [] };
const SECTION_LABELS = { type: 'FeatureCollection', features: [] };

function buildStadium() {
  const features = SECTIONS.features;
  const labels = SECTION_LABELS.features;

  // Field level (100s): 30 sections
  const n100 = 30;
  const deg100 = 360 / n100;
  for (let i = 0; i < n100; i++) {
    const s = i * deg100 - 90;
    const e = s + deg100;
    const num = 101 + i;
    const mid = (s + e) / 2 * Math.PI / 180;
    const r = 82;
    features.push(makeSection(64, 58, 96, 88, s, e, {
      id: `s${num}`, section: num, level: 100, floor: 0,
      label: `${num}`, type: 'section',
      status: Math.random() > 0.15 ? 'open' : 'closed',
    }));
    labels.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [CX + mLng(r) * Math.cos(mid), CY + mLat(r * 0.9) * Math.sin(mid)] }, properties: { label: `${num}`, size: 9, level: 100 } });
  }

  // 200-level (Club): 26 sections
  const n200 = 26;
  const deg200 = 360 / n200;
  for (let i = 0; i < n200; i++) {
    const s = i * deg200 - 90;
    const e = s + deg200;
    const num = 201 + i;
    const mid = (s + e) / 2 * Math.PI / 180;
    const r = 130;
    features.push(makeSection(112, 102, 138, 126, s, e, {
      id: `s${num}`, section: num, level: 200, floor: 1,
      label: `${num}`, type: 'section',
      status: Math.random() > 0.1 ? 'open' : 'closed',
    }));
    labels.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [CX + mLng(r) * Math.cos(mid), CY + mLat(r * 0.9) * Math.sin(mid)] }, properties: { label: `${num}`, size: 8, level: 200 } });
  }

  // 300-level (Upper): 22 sections
  const n300 = 22;
  const deg300 = 360 / n300;
  for (let i = 0; i < n300; i++) {
    const s = i * deg300 - 90;
    const e = s + deg300;
    const num = 301 + i;
    const mid = (s + e) / 2 * Math.PI / 180;
    const r = 162;
    features.push(makeSection(150, 136, 174, 158, s, e, {
      id: `s${num}`, section: num, level: 300, floor: 2,
      label: `${num}`, type: 'section',
      status: 'open',
    }));
    labels.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [CX + mLng(r) * Math.cos(mid), CY + mLat(r * 0.9) * Math.sin(mid)] }, properties: { label: `${num}`, size: 7, level: 300 } });
  }

  // Concourse rings
  const mkRing = (inX, inY, ouX, ouY, id, type) => ({ type: 'Feature', id,
    geometry: { type: 'Polygon', coordinates: [[...arcPoints(ouX, ouY, -180, 180, 3), ...arcPoints(inX, inY, 180, -180, 3).reverse(), [CX + mLng(ouX), CY]]] },
    properties: { id, type, floor: 0 }
  });

  // Concourse fill shapes (between ring sections)
  features.push({
    type: 'Feature', id: 'conc-100',
    geometry: { type: 'Polygon', coordinates: [[...arcPoints(96, 88, -180, 180, 3), ...arcPoints(112, 102, 180, -180, 3), [CX + mLng(96), CY]]] },
    properties: { id: 'conc-100', type: 'concourse', floor: 0, label: 'Field Level Concourse' }
  });
  features.push({
    type: 'Feature', id: 'conc-200',
    geometry: { type: 'Polygon', coordinates: [[...arcPoints(138, 126, -180, 180, 3), ...arcPoints(150, 136, 180, -180, 3), [CX + mLng(138), CY]]] },
    properties: { id: 'conc-200', type: 'concourse', floor: 1, label: 'Club Level Concourse' }
  });
  features.push({
    type: 'Feature', id: 'conc-300',
    geometry: { type: 'Polygon', coordinates: [[...arcPoints(174, 158, -180, 180, 3), ...arcPoints(192, 174, 180, -180, 3), [CX + mLng(174), CY]]] },
    properties: { id: 'conc-300', type: 'concourse', floor: 2, label: 'Upper Level Concourse' }
  });

  // Outer structure
  features.push({
    type: 'Feature', id: 'outer',
    geometry: { type: 'Polygon', coordinates: [[...arcPoints(192, 174, -180, 180, 3), ...arcPoints(220, 200, 180, -180, 3), [CX + mLng(192), CY]]] },
    properties: { id: 'outer', type: 'structure', floor: 0 }
  });

  // Playing field
  const fw = 56, fh = 46;
  features.push({
    type: 'Feature', id: 'field',
    geometry: { type: 'Polygon', coordinates: [[
      [CX - mLng(fw), CY - mLat(fh)], [CX + mLng(fw), CY - mLat(fh)],
      [CX + mLng(fw), CY + mLat(fh)], [CX - mLng(fw), CY + mLat(fh)],
      [CX - mLng(fw), CY - mLat(fh)]
    ]] },
    properties: { id: 'field', type: 'field', label: 'FIFA World Cup 2026' }
  });

  // Field markings
  const mkLine = (pts, id) => ({ type: 'Feature', id, geometry: { type: 'LineString', coordinates: pts }, properties: { id, type: 'marking' } });
  const LINES = { type: 'FeatureCollection', features: [
    mkLine([[CX, CY - mLat(fh)], [CX, CY + mLat(fh)]], 'center-line'),
    mkLine([[CX - mLng(fw), CY - mLat(fh)], [CX - mLng(fw), CY + mLat(fh)], [CX + mLng(fw), CY + mLat(fh)], [CX + mLng(fw), CY - mLat(fh)], [CX - mLng(fw), CY - mLat(fh)]], 'boundary'),
    mkLine([[CX - mLng(22), CY - mLat(fh)], [CX - mLng(22), CY - mLat(fh) + mLat(20)], [CX + mLng(22), CY - mLat(fh) + mLat(20)], [CX + mLng(22), CY - mLat(fh)]], 'pen-south'),
    mkLine([[CX - mLng(22), CY + mLat(fh)], [CX - mLng(22), CY + mLat(fh) - mLat(20)], [CX + mLng(22), CY + mLat(fh) - mLat(20)], [CX + mLng(22), CY + mLat(fh)]], 'pen-north'),
  ]};

  return LINES;
}

const FIELD_LINES = buildStadium();

// ── POI Data ───────────────────────────────────────────────────────────────
const POIS = [
  // CONCESSIONS / FOOD (field level)
  { id:'c-101a', name:'Concession 101A', type:'food', icon:'🍔', color:'#e8284a', level:'Field Level 100', section:'101', coords:[CX + mLng(78) * Math.cos((-90 + 6) * Math.PI/180), CY + mLat(70) * Math.sin((-90 + 6) * Math.PI/180)], inv: 0.45 },
  { id:'c-110a', name:'Concession 110A', type:'food', icon:'🌮', color:'#e8284a', level:'Field Level 100', section:'110', coords:[CX + mLng(78) * Math.cos((-90 + 118) * Math.PI/180), CY + mLat(70) * Math.sin((-90 + 118) * Math.PI/180)], inv: 0.72 },
  { id:'c-120a', name:'Concession 120A', type:'food', icon:'🍕', color:'#e8284a', level:'Field Level 100', section:'120', coords:[CX + mLng(78) * Math.cos((-90 + 238) * Math.PI/180), CY + mLat(70) * Math.sin((-90 + 238) * Math.PI/180)], inv: 0.21 },
  { id:'c-201a', name:'Pitchside Lounge', type:'food', icon:'🍴', color:'#e8284a', level:'Club Level 200', section:'201', coords:[CX + mLng(124) * Math.cos((-90 + 14) * Math.PI/180), CY + mLat(113) * Math.sin((-90 + 14) * Math.PI/180)], inv: 0.60 },
  { id:'c-214a', name:'Club Bar 214A', type:'food', icon:'🍴', color:'#e8284a', level:'Club Level 200', section:'214', coords:[CX + mLng(124) * Math.cos((-90 + 193) * Math.PI/180), CY + mLat(113) * Math.sin((-90 + 193) * Math.PI/180)], inv: 0.33 },
  { id:'c-222a', name:'Hospitality Access', type:'food', icon:'🍴', color:'#e8284a', level:'Club Level 200', section:'222', coords:[CX + mLng(124) * Math.cos((-90 + 289) * Math.PI/180), CY + mLat(113) * Math.sin((-90 + 289) * Math.PI/180)], inv: 0.85 },
  // BARS / DRINKS

// ── Map Init ───────────────────────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: {},
    layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#e8eaed' } }]
  },
  center: [CX, CY],
  zoom: 15.8,
  pitch: 0,
  bearing: 25,
  maxZoom: 21,
  minZoom: 13,
});

map.on('load', () => {
  initMapSources();
  addMapLayers();
  addPOIMarkers();
  renderSidebar('all');
  loadBPDBStats();
  startLiveUpdates();
});

// ── Sources ────────────────────────────────────────────────────────────────
function initMapSources() {
  map.addSource('sections', { type: 'geojson', data: SECTIONS, generateId: false });
  map.addSource('section-labels', { type: 'geojson', data: SECTION_LABELS });
  map.addSource('field-lines', { type: 'geojson', data: FIELD_LINES });
  map.addSource('crowd', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
}

// ── Layers ─────────────────────────────────────────────────────────────────
function addMapLayers() {
  // Outer structure
  map.addLayer({ id: 'outer-fill', type: 'fill', source: 'sections',
    filter: ['==', ['get','type'], 'structure'],
    paint: { 'fill-color': '#b0b4c0', 'fill-opacity': 1 }
  });

  // Crowd heatmap
  map.addLayer({ id: 'crowd-heat', type: 'heatmap', source: 'crowd',
    paint: {
      'heatmap-weight': ['get','w'],
      'heatmap-radius': 30,
      'heatmap-color': ['interpolate',['linear'],['heatmap-density'],
        0,'rgba(0,0,0,0)',0.3,'rgba(255,186,56,0.4)',0.7,'rgba(232,40,74,0.6)',1,'rgba(150,0,30,0.8)'
      ],
      'heatmap-opacity': 0.6,
    }
  });

  // Concourse rings
  map.addLayer({ id: 'conc-fill', type: 'fill', source: 'sections',
    filter: ['==', ['get','type'], 'concourse'],
    paint: { 'fill-color': '#c8ccd8', 'fill-opacity': 1 }
  });

  // 300-level sections
  map.addLayer({ id: 'sec-300-fill', type: 'fill', source: 'sections',
    filter: ['==', ['get','level'], 300],
    paint: {
      'fill-color': ['case', ['==',['get','status'],'closed'], '#a0a4b0', '#c4c8d6'],
      'fill-opacity': 1
    }
  });

  // 200-level sections
  map.addLayer({ id: 'sec-200-fill', type: 'fill', source: 'sections',
    filter: ['==', ['get','level'], 200],
    paint: {
      'fill-color': ['case', ['==',['get','status'],'closed'], '#a0a4b0', '#e8c0d8'],
      'fill-opacity': 1
    }
  });

  // 100-level sections (field level)
  map.addLayer({ id: 'sec-100-fill', type: 'fill', source: 'sections',
    filter: ['==', ['get','level'], 100],
    paint: {
      'fill-color': ['case', ['==',['get','status'],'closed'], '#a8acbc', '#f0b8d0'],
      'fill-opacity': 1
    }
  });

  // Section outlines
  map.addLayer({ id: 'sec-outline', type: 'line', source: 'sections',
    filter: ['in', ['get','level'], ['literal', [100, 200, 300]]],
    paint: { 'line-color': '#fff', 'line-width': 0.8, 'line-opacity': 0.7 }
  });

  // Field green
  map.addLayer({ id: 'field-fill', type: 'fill', source: 'sections',
    filter: ['==', ['get','type'], 'field'],
    paint: { 'fill-color': '#3d8f3d', 'fill-opacity': 1 }
  });

  // Field inner (lighter)
  map.addLayer({ id: 'field-inner', type: 'fill', source: 'sections',
    filter: ['==', ['get','type'], 'field'],
    paint: { 'fill-color': '#4caf50', 'fill-opacity': 0.6, 'fill-antialias': true }
  });

  // Field lines
  map.addLayer({ id: 'field-lines', type: 'line', source: 'field-lines',
    paint: { 'line-color': '#ffffff', 'line-width': 1.5, 'line-opacity': 0.9 }
  });

  // Center circle
  addCenterCircle();

  // Field label
  map.addLayer({ id: 'field-label', type: 'symbol', source: 'sections',
    filter: ['==', ['get','type'], 'field'],
    layout: {
      'text-field': 'FIFA\nWORLD CUP\n2026',
      'text-size': 10,
      'text-font': ['Open Sans Bold','Arial Unicode MS Bold'],
      'text-letter-spacing': 0.2,
    },
    paint: { 'text-color': 'rgba(255,255,255,0.7)', 'text-halo-color': 'rgba(0,100,0,0.5)', 'text-halo-width': 1 }
  });

  // Section number labels
  map.addLayer({ id: 'sec-labels', type: 'symbol', source: 'section-labels',
    minzoom: 15.5,
    layout: {
      'text-field': ['get','label'],
      'text-font': ['Open Sans Bold','Arial Unicode MS Bold'],
      'text-size': ['get','size'],
    },
    paint: {
      'text-color': '#444',
      'text-halo-color': 'rgba(255,255,255,0.8)',
      'text-halo-width': 1.5,
    }
  });

  // Click on section
  map.on('click', 'sec-100-fill', e => showSectionDetail(e.features[0].properties));
  map.on('click', 'sec-200-fill', e => showSectionDetail(e.features[0].properties));
  map.on('click', 'sec-300-fill', e => showSectionDetail(e.features[0].properties));
  ['sec-100-fill','sec-200-fill','sec-300-fill'].forEach(l => {
    map.on('mouseenter', l, () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', l, () => map.getCanvas().style.cursor = '');
  });
}

function addCenterCircle() {
  // Center circle (10m radius) as approximated polygon
  const pts = [];
  for (let a = 0; a <= 360; a += 5) {
    pts.push([CX + mLng(9) * Math.cos(a*Math.PI/180), CY + mLat(9) * Math.sin(a*Math.PI/180)]);
  }
  map.addSource('center-circle', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'Polygon', coordinates: [pts] }, properties: {} } });
  map.addLayer({ id: 'center-circle', type: 'line', source: 'center-circle', paint: { 'line-color': '#fff', 'line-width': 1.5, 'line-opacity': 0.9 } });
}

// ── POI Markers ────────────────────────────────────────────────────────────
const poiMarkers = [];
let selectedPOI = null;

function addPOIMarkers() {
  POIS.forEach(poi => {
    const el = document.createElement('div');
    el.style.cssText = `display:flex;flex-direction:column;align-items:center;cursor:pointer;`;
    el.innerHTML = `<div class="poi-marker" style="background:${poi.color};" data-id="${poi.id}">${poi.icon}</div>`;
    el.addEventListener('click', (e) => { e.stopPropagation(); selectPOI(poi); });

    const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
      .setLngLat(poi.coords)
      .addTo(map);

    poiMarkers.push({ poi, marker, el });
  });
}

function selectPOI(poi) {
  selectedPOI = poi;
  // Highlight in sidebar
  document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('sel'));
  const sbItem = document.querySelector(`.sb-item[data-id="${poi.id}"]`);
  if (sbItem) { sbItem.classList.add('sel'); sbItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  // Show detail card
  showPOIDetail(poi);
  // Fly to
  map.flyTo({ center: poi.coords, zoom: Math.max(map.getZoom(), 17), duration: 600 });
}

function showPOIDetail(poi) {
  const invPct = poi.inv != null ? Math.round(poi.inv * 100) : null;
  const invCol = invPct == null ? '' : invPct < 20 ? '#e8284a' : invPct < 40 ? '#f5a623' : '#00c85a';
  document.getElementById('dc-hero').style.background = poi.color;
  document.getElementById('dc-icon').textContent = poi.icon;
  document.getElementById('dc-name').textContent = poi.name;
  document.getElementById('dc-loc').textContent = `${poi.level}, Miami Stadium, Miami`;
  document.getElementById('dc-rows').innerHTML = `
    <div class="dc-row"><span class="dc-lbl">Section</span><span class="dc-val">${poi.section || '—'}</span></div>
    <div class="dc-row"><span class="dc-lbl">Level</span><span class="dc-val">${poi.level}</span></div>
    ${invPct != null ? `<div class="dc-row"><span class="dc-lbl">Inventory</span><span class="dc-val" style="color:${invCol}">${invPct}%</span></div>` : ''}
    <div class="dc-row"><span class="dc-lbl">Type</span><span class="dc-val">${poi.type.charAt(0).toUpperCase()+poi.type.slice(1)}</span></div>
    <div class="dc-row"><span class="dc-lbl">Status</span><span class="dc-val" style="color:#00c85a">● Open</span></div>
  `;
  document.getElementById('detail-card').classList.add('open');
}

function showSectionDetail(props) {
  const colors = { 100:'#e8284a', 200:'#c040a0', 300:'#7c3aed' };
  document.getElementById('dc-hero').style.background = colors[props.level] || '#555';
  document.getElementById('dc-icon').textContent = '🏟';
  document.getElementById('dc-name').textContent = `Section ${props.section}`;
  document.getElementById('dc-loc').textContent = `Level ${props.level === 100 ? 'Field Level 100' : props.level + '-Level'}, Miami Stadium`;
  document.getElementById('dc-rows').innerHTML = `
    <div class="dc-row"><span class="dc-lbl">Section</span><span class="dc-val">${props.section}</span></div>
    <div class="dc-row"><span class="dc-lbl">Level</span><span class="dc-val">${props.level}</span></div>
    <div class="dc-row"><span class="dc-lbl">Status</span><span class="dc-val" style="color:${props.status==='open'?'#00c85a':'#e8284a'}">● ${props.status==='open'?'Open':'Closed'}</span></div>
    <div class="dc-row"><span class="dc-lbl">Staff</span><span class="dc-val">${POIS.filter(p=>p.type==='staff'&&p.section===String(props.section)).length}</span></div>
  `;
  document.getElementById('detail-card').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-card').classList.remove('open');
  selectedPOI = null;
  document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('sel'));
}

// ── Sidebar ────────────────────────────────────────────────────────────────
let currentCat = 'all';
let searchQuery = '';

const CAT_LABELS = { food:'Concession', drink:'Bar & Drinks', staff:'Staff', info:'Facilities' };

function renderSidebar(cat) {
  const q = searchQuery.toLowerCase();
  const items = POIS.filter(p => {
    if (cat !== 'all' && p.type !== cat) return false;
    if (q && !p.name.toLowerCase().includes(q) && !p.level?.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('sb-list').innerHTML = items.map(poi => {
    const invPct = poi.inv != null ? Math.round(poi.inv * 100) : null;
    const invCol = invPct == null ? '#888' : invPct < 20 ? '#e8284a' : invPct < 40 ? '#f5a623' : '#00c85a';
    return `<div class="sb-item" data-id="${poi.id}" onclick="selectPOI(POIS.find(p=>p.id==='${poi.id}'))">
      <div class="sb-icon" style="background:${poi.color}20;color:${poi.color};">${poi.icon}</div>
      <div class="sb-info">
        <div class="sb-name">${poi.name}</div>
        <div class="sb-meta">${poi.level}${poi.section ? ' · Section ' + poi.section : ''}${invPct!=null?' · <span style="color:'+invCol+'">'+invPct+'% stock</span>':''}</div>
      </div>
      <div class="sb-arr">›</div>
    </div>`;
  }).join('') || `<div style="padding:24px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:10px;">No items found</div>`;
}

function setCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  // Show/hide markers by type
  poiMarkers.forEach(({ poi, el }) => {
    const show = cat === 'all' || poi.type === cat;
    el.style.display = show ? 'flex' : 'none';
  });
  renderSidebar(cat);
}

function filterList() {
  searchQuery = document.getElementById('sb-search').value;
  renderSidebar(currentCat);
}

// ── Scene Modes ────────────────────────────────────────────────────────────
const SCENES = {
  ops:      { pitch:0,  zoom:15.8, bearing:25,  label:'Operations' },
  food:     { pitch:0,  zoom:16.5, bearing:25,  label:'Food & Beverage' },
  security: { pitch:30, zoom:15.5, bearing:0,   label:'Security' },
  vip:      { pitch:0,  zoom:17.5, bearing:25,  center:[CX + mLng(110) * Math.cos((-90+110)*Math.PI/180), CY + mLat(100) * Math.sin((-90+110)*Math.PI/180)], label:'VIP' },
  crowd:    { pitch:45, zoom:15.5, bearing:25,  label:'Crowd Intelligence' },
};

function setScene(scene, btn) {
  document.querySelectorAll('.ts-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  const cfg = SCENES[scene];
  map.flyTo({ center: cfg.center || [CX,CY], zoom: cfg.zoom, pitch: cfg.pitch, bearing: cfg.bearing, duration: 1000 });
  // Filter markers for scene
  const catMap = { ops:'all', food:'food', security:'staff', vip:'drink', crowd:'all' };
  const catBtn = document.querySelector(`.cat-btn[data-cat="${catMap[scene]}"]`);
  if (catBtn) setCat(catMap[scene], catBtn);
  // Toggle heatmap
  if (map.getLayer('crowd-heat')) {
    map.setLayoutProperty('crowd-heat', 'visibility', scene === 'crowd' ? 'visible' : 'none');
  }
}

// ── Floor selector ─────────────────────────────────────────────────────────
function setFloor(floor, btn) {
  document.querySelectorAll('.fs').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  // Filter section visibility
  const lvlMap = { 0: [100], 1: [200], 2: [300], 3: [100, 200, 300] };
  const visible = lvlMap[floor] || [100, 200, 300];
  [100, 200, 300].forEach(lvl => {
    const lid = `sec-${lvl}-fill`;
    if (map.getLayer(lid)) {
      map.setLayoutProperty(lid, 'visibility', visible.includes(lvl) ? 'visible' : 'none');
    }
  });
  // Filter POI markers
  poiMarkers.forEach(({ poi, el }) => {
    const poiFloor = { 100: 0, 200: 1, 300: 2 }[
      parseInt((poi.level?.match(/\d{3}/)||['100'])[0])
    ] ?? 0;
    el.style.display = (floor === 3 || poiFloor === floor) ? 'flex' : 'none';
  });
}

// ── Live crowd simulation ──────────────────────────────────────────────────
function startLiveUpdates() {
  setInterval(() => {
    const t = Date.now();
    const pts = [];
    const hotspots = [
      { c: [CX + mLng(80) * Math.cos(20*Math.PI/180), CY + mLat(72) * Math.sin(20*Math.PI/180)], w: 0.8+Math.sin(t/10000)*0.15 },
      { c: [CX + mLng(80) * Math.cos(140*Math.PI/180), CY + mLat(72) * Math.sin(140*Math.PI/180)], w: 0.65+Math.cos(t/12000)*0.2 },
      { c: [CX + mLng(80) * Math.cos(260*Math.PI/180), CY + mLat(72) * Math.sin(260*Math.PI/180)], w: 0.7+Math.sin(t/14000)*0.15 },
      { c: [CX + mLng(120) * Math.cos(60*Math.PI/180), CY + mLat(108) * Math.sin(60*Math.PI/180)], w: 0.9 },
    ];
    hotspots.forEach(h => {
      for (let i=0; i<20; i++) {
        pts.push({ type:'Feature', geometry:{ type:'Point', coordinates:[
          h.c[0]+(Math.random()-.5)*mLng(60), h.c[1]+(Math.random()-.5)*mLat(50)
        ]}, properties:{ w: h.w*(0.6+Math.random()*0.4) } });
      }
    });
    if (map.getSource('crowd')) map.getSource('crowd').setData({ type:'FeatureCollection', features:pts });
    const avgW = hotspots.reduce((s,h)=>s+h.w,0)/hotspots.length;
    document.getElementById('hs-crowd').textContent = Math.round(avgW*100)+'%';
  }, 2500);
}

// ── BPDB Stats ─────────────────────────────────────────────────────────────
function loadBPDBStats() {
  if (!window.BPDB) return;
  const staff = BPDB.getAllStaff({ status: 'active' });
  const alerts = BPDB.getAlerts({ resolved: false });
  const m = BPDB.getSalesMetrics({ from: new Date().setHours(0,0,0,0) });
  document.getElementById('hs-staff').textContent = staff.length;
  document.getElementById('hs-alerts').textContent = alerts.length;
  document.getElementById('hs-rev').textContent = '$' + Math.round(m.revenue/1000)+'K';
  BPDB.on('transaction:new', () => {
    const m2 = BPDB.getSalesMetrics({ from: new Date().setHours(0,0,0,0) });
    document.getElementById('hs-rev').textContent = '$' + Math.round(m2.revenue/1000)+'K';
  });
}

// ── Navigation actions ─────────────────────────────────────────────────────
function flyToStadium() { map.flyTo({ center: [CX,CY], zoom: 15.8, pitch: 0, bearing: 25, duration: 1000 }); }
function sendToPhone() { alert('📱 Link sent to phone'); }
function takeMeThere() {
  if (!selectedPOI) return;
  map.flyTo({ center: selectedPOI.coords, zoom: 18.5, pitch: 45, duration: 1200 });
}

map.on('click', e => {
  const features = map.queryRenderedFeatures(e.point, { layers: ['sec-100-fill','sec-200-fill','sec-300-fill'] });
  if (!features.length && !e.originalEvent.target.closest('.poi-marker')) closeDetail();
});
